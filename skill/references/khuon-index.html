<!doctype html>
<!--
  KHUÔN MẪU dọc 9:16 cho skill dung-video-tho (HyperFrames).
  - c01.mp4 đoạn 2,0–6,0 s (giọng thật) → mờ chồng 0,4 s → c02.mp4 đoạn 10,0–14,0 s → kết.
  - Chữ hook 0–2,2 s, chữ kết, nhạc nền nhỏ xuống khi có lời (ducking bằng data-automation).
  - Đổi tên file / mốc theo bảng cắt KE-HOACH.md. Mỗi <video>/<audio> PHẢI có id. Phụ đề từng chữ: skill embedded-captions.
  - Clip câm / b-roll: bỏ data-has-audio="true", thêm muted.
-->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Khuôn dựng video thô 9:16</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #000; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .inner { position: absolute; inset: 0; }
      .inner video { width: 100%; height: 100%; object-fit: cover; }
      .chu {
        position: absolute; left: 60px; right: 60px; text-align: center; color: #fff;
        font-weight: 800; line-height: 1.15; letter-spacing: -0.01em;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #hook { top: 260px; font-size: 92px; }
      #ket { top: 760px; font-size: 84px; }
      #ket small { display: block; margin-top: 28px; font-size: 48px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="11">
      <!-- Đoạn 1: c01 giây 2–6, đặt ở 0–4,4 (dư 0,4 s cho mờ chồng) -->
      <div id="v1-hinh" class="inner">
        <video id="v1" src="c01.mp4" data-start="0" data-duration="4.4" data-media-start="2" data-track-index="0"
          playsinline data-has-audio="true"
          data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":4,"v":1},{"t":4.4,"v":0}]}]}'></video>
      </div>

      <!-- Đoạn 2: c02 giây 10–14, vào từ 4,0 (chồng 0,4 s) -->
      <div id="v2-hinh" class="inner">
        <!-- chạy dư tới 8,5 s để đoạn kết mờ chồng LÊN hình, không mờ từ nền đen -->
        <video id="v2" src="c02.mp4" data-start="4" data-duration="4.5" data-media-start="10" data-track-index="1"
          playsinline data-has-audio="true"
          data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":4,"v":1},{"t":4.5,"v":0}]}]}'></video>
      </div>

      <!-- Kết 8–11 s: cảnh cuối của c02 làm nền + lớp tối nhẹ + chữ kêu gọi -->
      <div id="v3-hinh" class="inner">
        <video id="v3" src="c02.mp4" data-start="8" data-duration="3" data-media-start="14" data-track-index="2"
          playsinline muted></video>
      </div>
      <div id="toi" class="clip inner" data-start="8" data-duration="3"
        style="background: linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.25))"></div>

      <div id="hook" class="clip chu" data-start="0" data-duration="2.2">Câu hook ≤ 6 từ</div>
      <div id="ket" class="clip chu" data-start="8" data-duration="3">Câu kêu gọi<small>Tên shop · link</small></div>

      <!-- Phụ đề: scripts/phu-de.mjs tự điền giữa 2 dấu này (đừng xoá dấu) -->
      <!-- PHU-DE:BAT-DAU --><!-- PHU-DE:KET-THUC -->

      <!-- Nhạc nền: 0,3 khi có lời (0–8 s), lên 0,8 ở kết, mờ ra cuối. Video không lời → để 0,9–1,0 suốt.
           Render xong luôn chuẩn hoá −14 LUFS bằng ffmpeg loudnorm (SKILL.md Bước 6). -->
      <audio id="nhac" src="nhac.mp3" data-start="0" data-duration="11" data-track-index="10"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.3},{"t":8,"v":0.3},{"t":8.4,"v":0.8},{"t":10.2,"v":0.8},{"t":11,"v":0}]}]}'></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Hook: hiện ngay giây 0 (không mờ từ đen), nảy nhẹ
      tl.from("#hook", { y: 30, scale: 0.96, duration: 0.35, ease: "power3.out" }, 0)
        .to("#hook", { opacity: 0, duration: 0.3 }, 1.9);
      // Zoom nhấn đúng chữ quan trọng (≤ 1 lần / 5 s) — nhắm khung bọc .inner, không nhắm thẻ có data-start
      tl.to("#v1-hinh", { scale: 1.12, duration: 0.25, ease: "power2.out" }, 1.6);
      // Mờ chồng 0,4 s (KHÔNG chớp)
      tl.set("#v2-hinh", { opacity: 0 }, 0)
        .to("#v1-hinh", { opacity: 0, duration: 0.4 }, 4)
        .to("#v2-hinh", { opacity: 1, duration: 0.4 }, 4);
      // Vào kết: mờ chồng lên c02 đang chạy + lớp tối từ từ cho chữ nổi
      tl.set("#v3-hinh", { opacity: 0 }, 0)
        .to("#v3-hinh", { opacity: 1, duration: 0.5 }, 8)
        .from("#toi", { opacity: 0, duration: 0.5 }, 8)
        .from("#ket", { opacity: 0, y: 24, duration: 0.45, ease: "power3.out" }, 8.2);
      // PHU-DE-JS:BAT-DAU
      // PHU-DE-JS:KET-THUC
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
